[package]
name = "onnextlabs-site"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"
clap = { version = "4.6.7", features = ["derive", "env"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
hmac = "0.13.0"
hex = "0.4.3"
base64 = "0.23.1"
rand = "0.10.3"
openidconnect = { version = "4.1.0", default-features = false, features = ["reqwest", "rustls-tls"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
time = "0.3.55"

[profile.release]
lto = true
strip = true
