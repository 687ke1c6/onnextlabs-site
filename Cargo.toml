[workspace]
members = ["crates/*"]
# `cargo run` / `cargo build` without -p mean the site.
default-members = ["crates/site"]
resolver = "2"

# Versions shared by more than one crate.
[workspace.dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"
clap = { version = "4.6.7", features = ["derive", "env"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
base64 = "0.23.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio-util = { version = "0.7.20", features = ["io"] }
db-protocol = { path = "crates/db-protocol" }

[profile.release]
lto = true
strip = true
