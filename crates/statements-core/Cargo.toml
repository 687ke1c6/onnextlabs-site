[package]
name = "statements-core"
version = "0.3.0"
edition = "2024"
description = "Bank statements: detect and parse them, give rows n8n-compatible ids and types, append them to Google Sheets."

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
csv = "1.4.0"
getrandom = "0.4.3"
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = { version = "3.5.2", features = ["json"] }
url = "2.5.8"
