[package]
name = "onnextlabs-site"
version = "0.6.0"
edition = "2021"

[dependencies]
axum = { workspace = true }
tokio = { workspace = true }
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
hmac = "0.13.0"
hex = "0.4.3"
base64 = { workspace = true }
rand = "0.10.3"
openidconnect = { version = "4.1.0", default-features = false, features = ["reqwest", "rustls-tls"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
time = "0.3.55"
tokio-util = { workspace = true }
futures-util = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "socks"] }
quick-xml = "0.37"
percent-encoding = "2.3.2"
statements-core = { path = "../statements-core" }
statements-pdf = { path = "../statements-pdf" }
# Used with statements-core's blocking Google client.
anyhow = "1.0.104"
ureq = { version = "3.5.2", features = ["json"] }
db-protocol = { workspace = true, features = ["sqlite"] }
